name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the older, now-outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# npm workspaces: one root lockfile installs both server/ and client/.
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fail on high or critical vulnerabilities (server and client)
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Prisma's config needs a URL even for commands that don't connect.
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL)
    # Service containers only run on Linux runners.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splitter
          POSTGRES_PASSWORD: splitter
          POSTGRES_DB: splitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
      TEST_DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run test:integration
