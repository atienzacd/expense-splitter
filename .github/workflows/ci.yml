name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    env:
      # Prisma's config needs a URL even for commands that don't connect.
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL)
    # Service containers only run on Linux runners.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splitter
          POSTGRES_PASSWORD: splitter
          POSTGRES_DB: splitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
      TEST_DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:integration
