name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR cancels its older, now-outdated run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# npm workspaces: one root lockfile installs both server/ and client/.
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fail on high or critical vulnerabilities (server and client)
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Prisma's config needs a URL even for commands that don't connect.
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL)
    # Service containers only run on Linux runners.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splitter
          POSTGRES_PASSWORD: splitter
          POSTGRES_DB: splitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
      TEST_DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splitter
          POSTGRES_PASSWORD: splitter
          POSTGRES_DB: splitter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma's config needs a URL; the e2e config passes the real one to the API.
      DATABASE_URL: postgresql://splitter:splitter@localhost:5432/splitter_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      # On failure, keep the report with screenshots and traces to see what went wrong.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Docker image (build, scan, run)
    runs-on: ubuntu-latest
    env:
      # A throwaway secret just for this smoke test.
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the app and migration images
        run: docker compose build
      - name: Scan the image (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expense-splitter:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Start the whole app (database, migrations, app)
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -eu
          base=http://127.0.0.1:8080
          curl -fsS "$base/api/health" | grep -q '"database":"ok"'
          curl -fsS "$base/" | grep -q "<title>Expense Splitter</title>"
          curl -fsS "$base/groups/anything" | grep -q "<title>Expense Splitter</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/nope")" = 404
          curl -fsSI "$base/" | grep -qi "content-security-policy"
          echo "Smoke test passed"
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
